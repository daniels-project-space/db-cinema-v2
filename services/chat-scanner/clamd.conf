Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
EnableShutdownCommand no
EnableReloadCommand no
EnableStatsCommand no
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 50M
MaxRecursion 12
MaxFiles 1000
AlertEncrypted yes
AlertExceedsMax yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
ScanPDF yes
ScanArchive yes
ScanPE yes
ScanELF yes
MaxThreads 2
MaxQueue 4
ReadTimeout 15
