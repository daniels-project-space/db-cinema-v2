name: Production type check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-types:
    name: DB Cinema production types
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CONVEX_URL: https://example.invalid
      DBC_CONVEX_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate route types
        run: npx next typegen
      - name: Check types
        run: npx tsc --noEmit
