# CI gate — catches tsc/test breakage before Vercel builds. NON-DEPLOY-GATING (pure signal).
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.serena/**']
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # PRs exercise the staged backend; main exercises the published backend.
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ github.event_name == 'pull_request' && 'https://deafening-stoat-340.convex.cloud' || 'https://veracious-wombat-196.convex.cloud' }}
      DBC_CONVEX_URL: ${{ github.event_name == 'pull_request' && 'https://deafening-stoat-340.convex.cloud' || 'https://veracious-wombat-196.convex.cloud' }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"; else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.pm == 'pnpm'
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ steps.pm.outputs.pm }}
      - name: Install
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile || pnpm install
          else
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          fi
      - name: Typecheck (script if defined, else tsc --noEmit)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck?0:1)"; then
            ${{ steps.pm.outputs.pm }} run typecheck
          else
            npx --yes tsc --noEmit
          fi
      - name: Tests (if a test script exists)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            ${{ steps.pm.outputs.pm }} test
          else
            echo "no test script — skipping"
          fi
      - name: Build production app for browser regression
        run: npm run build
      - name: Membership basket and checkout browser regression
        env:
          DBC_BROWSER_ROOT: http://127.0.0.1:41795
          DBC_CDP_URL: http://127.0.0.1:9224
        run: |
          npm run start -- --hostname 127.0.0.1 --port 41795 > "$RUNNER_TEMP/dbc-next.log" 2>&1 &
          NEXT_PID=$!
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --no-first-run --no-default-browser-check --disable-background-networking --remote-debugging-port=9224 --user-data-dir="$RUNNER_TEMP/dbc-membership-browser" about:blank > "$RUNNER_TEMP/dbc-chrome.log" 2>&1 &
          CHROME_PID=$!
          cleanup() {
            RESULT=$?
            if [ "$RESULT" -ne 0 ]; then
              cat "$RUNNER_TEMP/dbc-next.log"
              cat "$RUNNER_TEMP/dbc-chrome.log"
            fi
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:41795/cart >/dev/null && curl -fsS http://127.0.0.1:9224/json/version >/dev/null; then READY=true; break; fi
            sleep 1
          done
          if [ "$READY" != true ]; then
            echo "Browser test server did not become ready"
            exit 1
          fi
          node scripts/test-browser-cdp.cjs
          npm run test:membership-browser
