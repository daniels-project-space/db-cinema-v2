# CI gate — catches tsc/test breakage before Vercel builds. NON-DEPLOY-GATING (pure signal).
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.serena/**']
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# PRs exercise the staged backend; main exercises the published backend.
env:
  NEXT_PUBLIC_CONVEX_URL: ${{ github.event_name == 'pull_request' && 'https://deafening-stoat-340.convex.cloud' || 'https://zany-wolf-18.convex.cloud' }}
  DBC_CONVEX_URL: ${{ github.event_name == 'pull_request' && 'https://deafening-stoat-340.convex.cloud' || 'https://zany-wolf-18.convex.cloud' }}
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck (script if defined, else tsc --noEmit)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck?0:1)"; then
            npm run typecheck
          else
            npx --yes tsc --noEmit
          fi
      - name: Verify checkout backend binding and required stock function
        # Invalid argument types are rejected before the action body runs.
        # A missing staged function must not be disguised as a browser timeout.
        run: node scripts/check-stock-backend.cjs
      - name: Verify rental checkout release readiness
        run: node scripts/test-checkout-release-readiness.cjs
      - name: Verify saved checkout prices use exact rental duration
        run: node scripts/test-checkout-recovery-pricing.cjs
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phase: [pretest, test, posttest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PDF test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Run ${{ matrix.phase }}
        env:
          TEST_PHASE: ${{ matrix.phase }}
        run: |
          node -e 'if (!require("./package.json").scripts?.[process.env.TEST_PHASE]) process.exit(1)'
          npm --ignore-scripts run "$TEST_PHASE"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production app for browser regression
        run: npm run build
      - name: Membership basket and checkout browser regression
        env:
          DBC_BROWSER_ROOT: http://127.0.0.1:41795
          DBC_CDP_URL: http://127.0.0.1:9224
        run: |
          npm run start -- --hostname 127.0.0.1 --port 41795 > "$RUNNER_TEMP/dbc-next.log" 2>&1 &
          NEXT_PID=$!
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --no-first-run --no-default-browser-check --disable-background-networking --remote-debugging-port=9224 --user-data-dir="$RUNNER_TEMP/dbc-membership-browser" about:blank > "$RUNNER_TEMP/dbc-chrome.log" 2>&1 &
          CHROME_PID=$!
          cleanup() {
            RESULT=$?
            if [ "$RESULT" -ne 0 ]; then
              cat "$RUNNER_TEMP/dbc-next.log"
              cat "$RUNNER_TEMP/dbc-chrome.log"
            fi
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:41795/cart >/dev/null && curl -fsS http://127.0.0.1:9224/json/version >/dev/null; then READY=true; break; fi
            sleep 1
          done
          if [ "$READY" != true ]; then
            echo "Browser test server did not become ready"
            exit 1
          fi
          node scripts/test-browser-cdp.cjs
          npm run test:membership-browser
          node scripts/test-verification-suspension-browser.cjs
          node scripts/test-verification-claim-browser.cjs
          node scripts/test-verification-signin-browser.cjs
          node scripts/test-verification-unavailable-browser.cjs
          node scripts/test-verification-admin-delivery-browser.cjs
          node scripts/test-account-verification-badge-browser.cjs
          DBC_CHECKOUT_ROOT=http://127.0.0.1:41795 node scripts/test-checkout-boundary-browser.cjs
          DBC_CHECKOUT_SCREENSHOTS="$RUNNER_TEMP/dbc-checkout-draft-review" node scripts/test-checkout-draft-browser.cjs
